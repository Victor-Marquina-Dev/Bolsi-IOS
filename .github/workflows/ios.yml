# Compila Bolsi iOS en una Mac de la nube, saca capturas del simulador y deja un .ipa.
#
# ESTE ARCHIVO ES EL COMPILADOR DE ESTE PROYECTO. En la máquina donde se escribe el código no
# hay macOS, así que el runner de GitHub hace de Xcode. Y hace algo más importante que
# compilar: **devuelve capturas**. Eso convierte el trabajo de "escribir a ciegas" en el mismo
# loop que funcionó en Android — construir, mirar, corregir — solo que la vuelta tarda minutos
# en vez de segundos.
#
# POR QUÉ TODO SE REPORTA COMO ANOTACIÓN (`::notice::` / `::error::`)
# El log de un job solo se puede descargar con permisos de admin del repo. Las **anotaciones**,
# en cambio, se leen por la API pública. Así que cada dato que hace falta para diagnosticar
# —versión de Xcode, simulador elegido, los `error:` del compilador— se emite como anotación y
# se puede leer sin credenciales. Sin esto, cada fallo obliga a pedirle al dueño que copie el
# log a mano.
#
# El simulador de la nube no llega al backend de la LAN del dueño, así que las capturas se
# sacan en MODO MAQUETA. Cada cosa verifica lo que puede: la nube verifica la FORMA, el iPhone
# verifica los DATOS.

name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: Tests de BolsiCore
    # macos-15 y no macos-14: el paquete declara `swift-tools-version: 6.0` y usa el framework
    # de testing de Swift 6, que llegó con Xcode 16. En el runner viejo el manifiesto ni se
    # puede leer, y el job muere en ocho segundos sin decir por qué.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Elegir el Xcode más nuevo y reportar el entorno
        run: |
          ultimo=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$ultimo" ]; then sudo xcode-select -s "$ultimo"; fi
          echo "::notice title=Entorno::macOS $(sw_vers -productVersion) | $(xcodebuild -version | tr '\n' ' ') | $(swift --version 2>&1 | head -1) | Xcodes: $(ls -d /Applications/Xcode*.app 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"

      - name: Tests del núcleo
        run: |
          set +e
          swift test 2>&1 | tee salida.txt
          codigo=${PIPESTATUS[0]}
          if [ "$codigo" -ne 0 ]; then
            resumen=$(grep -E "error:|error " salida.txt | head -6 | tr '\n' '~' | sed 's/~/ %0A /g')
            echo "::error title=Fallaron los tests del núcleo::${resumen:-sin lineas de error; ver el log}"
          else
            echo "::notice title=Núcleo OK::$(grep -E 'Test run with' salida.txt | tail -1)"
          fi
          exit "$codigo"

  app:
    name: Compilar y capturar
    runs-on: macos-15
    needs: nucleo
    # Escritura para publicar las capturas en su propia rama (ver el paso del final).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Elegir el Xcode más nuevo
        run: |
          ultimo=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$ultimo" ]; then sudo xcode-select -s "$ultimo"; fi

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto de Xcode
        run: |
          set +e
          xcodegen generate 2>&1 | tee gen.txt
          codigo=${PIPESTATUS[0]}
          if [ "$codigo" -ne 0 ]; then
            echo "::error title=XcodeGen falló::$(tail -6 gen.txt | tr '\n' '~' | sed 's/~/ %0A /g')"
          fi
          exit "$codigo"

      - name: Elegir un iPhone del simulador
        id: sim
        run: |
          # El boceto mide 393 x 852: es el tamano exacto de un iPhone 14/15/16 "pelado".
          # Elegir el simulador por nombre no sirve (cambia con cada Xcode) y ordenar
          # alfabeticamente tampoco: "iPhone SE" le gana a "iPhone 16" y el SE mide 375 x 667,
          # asi que las capturas saldrian de otra pantalla y la comparacion mentiria. Se elige
          # el modelo numerico mas alto SIN sufijo (ni SE, ni mini, ni Plus, ni Pro).
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,re,sys; d=json.load(sys.stdin)['devices']; c=[(int(m.group(1)), x['udid']) for r,l in d.items() if 'iOS' in r for x in l if (m := re.fullmatch(r'iPhone (\d+)', x['name']))]; alt=[x['udid'] for r,l in d.items() if 'iOS' in r for x in l if 'iPhone' in x['name']]; print(max(c)[1] if c else (alt[-1] if alt else ''))")
          nombre=$(xcrun simctl list devices available | grep "$udid" | sed 's/ (.*//' | xargs)
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "::notice title=Simulador::$nombre ($udid)"

      - name: Compilar para el simulador
        run: |
          set +e
          xcodebuild build \
            -project Bolsi.xcodeproj \
            -scheme Bolsi \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='-DMAQUETA' 2>&1 | tee build.txt
          codigo=${PIPESTATUS[0]}
          if [ "$codigo" -ne 0 ]; then
            echo "::error title=No compiló::$(grep -E 'error:' build.txt | head -8 | tr '\n' '~' | sed 's/~/ %0A /g')"
          fi
          exit "$codigo"

      - name: Instalar en el simulador
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcrun simctl install booted build/Build/Products/Debug-iphonesimulator/Bolsi.app

      - name: Capturar cada pestaña
        run: |
          mkdir -p capturas
          # OSCURO PRIMERO. El boceto declara `"theme": "dark"` en sus `data-props`: oscuro es el
          # estado en que el dueño lo aprobó, y es el que hay que comparar. El simulador arranca
          # en claro, asi que la primera corrida saco las seis capturas en el tema equivocado.
          xcrun simctl ui booted appearance dark
          # `BolsiPantalla` le dice a la app en qué pestaña abrir: así una sola corrida deja una
          # captura por pantalla y se pueden comparar todas contra el boceto de una vez.
          # `login` no es una pestana: es la pantalla previa, y va primero porque es la unica
          # que el modo maqueta esconde a proposito. Ver `Fuente.mostrarLogin`.
          for pantalla in login inicio cuentas bolsi analisis agenda; do
            xcrun simctl terminate booted com.bolsi.ios 2>/dev/null || true
            xcrun simctl launch booted com.bolsi.ios -BolsiPantalla "$pantalla"
            sleep 4
            xcrun simctl io booted screenshot "capturas/$pantalla.png"
          done
          # Y el tema claro, que el boceto también define completo.
          xcrun simctl ui booted appearance light
          xcrun simctl terminate booted com.bolsi.ios 2>/dev/null || true
          xcrun simctl launch booted com.bolsi.ios -BolsiPantalla inicio
          sleep 4
          xcrun simctl io booted screenshot "capturas/inicio-claro.png"
          echo "::notice title=Capturas::$(ls capturas | tr '\n' ' ')"

      # ── Un VIDEO de la app en uso ──
      # Una captura no muestra el movimiento, y el movimiento es la mitad de este boceto: la
      # pastilla de la barra que se desliza en 440 ms, los anillos de las metas que se llenan,
      # las transiciones entre pestanas. `simctl` sabe grabar la pantalla pero NO sabe tocarla,
      # asi que la app se recorre sola con `-BolsiDemo 1` (ver `Fuente.demo`).
      #
      # Es lo mas parecido a ver la app andando mientras no se pueda instalar en el telefono.
      - name: Grabar el recorrido
        run: |
          xcrun simctl ui booted appearance dark
          xcrun simctl terminate booted com.bolsi.ios 2>/dev/null || true
          xcrun simctl io booted recordVideo --codec h264 --force capturas/recorrido.mp4 &
          grabador=$!
          sleep 2
          xcrun simctl launch booted com.bolsi.ios -BolsiDemo 1
          # Cinco pestanas a 2,4 s, mas margen para el arranque y para que cierre el archivo.
          sleep 16
          # SIGINT y no SIGKILL: `recordVideo` cierra el mp4 al recibir INT. Con KILL el
          # archivo queda sin el atomo `moov` y ningun reproductor lo abre.
          kill -INT $grabador 2>/dev/null || true
          wait $grabador 2>/dev/null || true
          if [ -s capturas/recorrido.mp4 ]; then
            echo "::notice title=Video::$(du -h capturas/recorrido.mp4 | cut -f1)"
          else
            echo "::notice title=Video::no se grabo"
            rm -f capturas/recorrido.mp4
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/*
          if-no-files-found: warn

      # ── Las capturas, tambien en una rama ──
      # El artefacto sirve para que el dueno lo baje del navegador. Pero para CORREGIR hay que
      # mirar la captura desde la maquina donde se escribe el codigo, y bajar un artefacto por
      # la API **pide autenticacion incluso en un repo publico** (devuelve 401). Un `git fetch`,
      # en cambio, ya tiene credenciales.
      #
      # Por eso las capturas se publican en una rama propia. Es lo que cierra el loop: construir,
      # MIRAR, corregir. Sin esto cada vuelta cuesta pedirle al dueno que descargue un zip.
      #
      # Rama huerfana de un solo commit, forzada en cada corrida: interesa la ultima foto, no la
      # historia. Y se arma en un directorio aparte para no poder tocar el arbol de trabajo.
      - name: Publicar las capturas en la rama capturas
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls capturas/*.png >/dev/null 2>&1; then
            echo "::notice title=Sin capturas::no hay nada que publicar"
            exit 0
          fi
          tmp=$(mktemp -d)
          cp capturas/* "$tmp/"
          cd "$tmp"
          echo "Capturas del simulador, generadas por la CI. Rama de un solo commit: se reescribe en cada corrida." > README.md
          git init -q -b capturas
          git config user.name "CI de Bolsi"
          git config user.email "ci@bolsi.local"
          git add -A
          git commit -q -m "Capturas de ${GITHUB_SHA:0:7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas
          echo "::notice title=Capturas publicadas::rama capturas, commit ${GITHUB_SHA:0:7}"

      # ── .ipa SIN FIRMAR, para instalar en el iPhone sin cuenta de Apple ──
      # No sirve para TestFlight (eso necesita firma y el programa de 99 USD). Sirve para
      # sideloading: una herramienta en la PC lo firma con un Apple ID gratis y lo instala por
      # cable. Se re-firma cada 7 días. Se genera igual porque no cuesta nada tenerlo listo.
      - name: Empaquetar .ipa sin firmar
        run: |
          set +e
          xcodebuild build \
            -project Bolsi.xcodeproj \
            -scheme Bolsi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath buildDispositivo \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee ipa.txt
          codigo=${PIPESTATUS[0]}
          if [ "$codigo" -ne 0 ]; then
            echo "::notice title=El .ipa no se armó::$(grep -E 'error:' ipa.txt | head -4 | tr '\n' '~' | sed 's/~/ %0A /g')"
            exit 0
          fi
          mkdir -p salida/Payload
          cp -R buildDispositivo/Build/Products/Release-iphoneos/Bolsi.app salida/Payload/
          cd salida && zip -qry ../Bolsi-sin-firmar.ipa Payload && cd ..
          echo "::notice title=IPA listo::$(du -h Bolsi-sin-firmar.ipa | cut -f1)"
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-sin-firmar
          path: Bolsi-sin-firmar.ipa
          if-no-files-found: ignore
